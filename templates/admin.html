<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body{
            font-family:Arial;
            background:#0f172a;
            color:white;
            text-align:center;
            margin:0;
        }

        h1{
            padding:20px;
        }

        .card{
            background:#1e293b;
            padding:15px;
            margin:20px auto;
            width:90%;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.4);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th, td{
            padding:12px;
            border-bottom:1px solid #334155;
        }

        th{
            background:#334155;
        }

        tr:hover{
            background:#475569;
        }

        a{
            color:#38bdf8;
            text-decoration:none;
        }
    </style>
</head>

<body>

<h1>🧑‍💼 Smart Parking Admin</h1>

<p>Total Bookings: {{ total }}</p>

<div class="card">

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Vehicle</th>
        <th>Slot</th>
        <th>Time</th>
    </tr>

    {% for b in data %}
    <tr>
        <td>{{ b[0] }}</td>
        <td>{{ b[1] }}</td>
        <td>{{ b[2] }}</td>
        <td>{{ b[3] }}</td>
        <td>{{ b[4] }}</td>
    </tr>
    {% endfor %}

</table>

</div>

<br>
<a href="/">⬅ Back Home</a>

</body>
</html>
