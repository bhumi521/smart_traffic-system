<!DOCTYPE html>
<html>
<head>
    <title>Parking Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        body{
            font-family:Arial;
            background:#0f172a;
            color:white;
            text-align:center;
        }

        #map{
            height:500px;
            width:90%;
            margin:auto;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
        }

        .box{
            margin-top:20px;
            padding:10px;
        }

        .item{
            background:#1e293b;
            margin:8px auto;
            width:80%;
            padding:10px;
            border-radius:8px;
        }
    </style>
</head>

<body>

<h1>🗺 Smart Parking Map</h1>

<div id="map"></div>

<div class="box">

{% for row in data %}
    <div class="item">
        👤 {{ row[0] }} |
        🚗 {{ row[1] }} |
        🅿 {{ row[2] }} |
        ⏰ {{ row[3] }}
    </div>
{% endfor %}

</div>

<script>

    var map = L.map('map').setView([17.6599, 75.9064], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'OpenStreetMap'
    }).addTo(map);

    L.marker([17.6599, 75.9064])
        .addTo(map)
        .bindPopup("🚗 Parking Center")
        .openPopup();

</script>

</body>
</html>
