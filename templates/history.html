<!DOCTYPE html>
<html>
<head>
    <title>Booking History</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #9face6);
            font-family: Arial;
        }

        .card {
            border-radius: 15px;
        }

        .header {
            font-weight: bold;
            margin-top: 20px;
        }

        .badge-slot {
            background-color: #28a745;
            padding: 5px 10px;
            border-radius: 8px;
            color: white;
        }

        .container-box {
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="container container-box">

    <h2 class="text-center header">📊 Booking History</h2>

    <div class="card shadow p-3 mt-3">

        <div class="table-responsive">

            <table class="table table-striped table-hover text-center">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Vehicle</th>
                        <th>Slot</th>
                        <th>Time</th>
                    </tr>
                </thead>

                <tbody>
                {% for r in data %}
                    <tr>
                        <td>{{ r[0] }}</td>
                        <td>👤 {{ r[1] }}</td>
                        <td>🚗 {{ r[2] }}</td>
                        <td><span class="badge-slot">{{ r[3] }}</span></td>
                        <td>⏰ {{ r[4] }}</td>
                    </tr>
                {% endfor %}
                </tbody>

            </table>

        </div>

    </div>

    <div class="text-center mt-3">
        <a href="/" class="btn btn-primary">🏠 Back Home</a>
    </div>

</div>

</body>
</html>
